<html><head><title>Perks & Play | Six Flags</title></head>
<body>
  <script>self.__next_f.push([1,"1:{\"_type\":\"page\",\"title\":\"Perks & Play\",\"sections\":[{\"_key\":\"82234ed9fd66\",\"_type\":\"accordionBlock\",\"accordionItems\":[{\"children\":[{\"_key\":\"2730dd6b8392\",\"_type\":\"block\",\"children\":[{\"_key\":\"97a0a296ff16\",\"_type\":\"span\",\"marks\":[],\"text\":\"Got the Pass? You'll get the perks. No visit requirements or complicated earning systems. Perks & Play will become available to active Passholders and Members throughout the season. Rewards will vary and will be redeemable at select in-park locations for a limited time. To redeem, present your Pass at designated locations during your visit. Check your perks before you arrive and redeem yours during your next visit!\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"What's new for 2026?\",\"id\":null},{\"children\":[{\"_key\":\"f2a32cd6ca6d\",\"_type\":\"block\",\"children\":[{\"_key\":\"ad29c3a8c889\",\"_type\":\"span\",\"marks\":[],\"text\":\"All Six Flags Parks, excluding La Ronde and Wild Safari.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"Which parks participate in the Perks & Play Loyalty Program?\",\"id\":null},{\"children\":[{\"_key\":\"05b89624c5c2\",\"_type\":\"block\",\"children\":[{\"_key\":\"2ac5667ed53f\",\"_type\":\"span\",\"marks\":[],\"text\":\"No sign-ups or enrollment, Passholders and Members qualify for Pass Perks as soon as you purchase your Season Pass or Membership.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"Do I need to join Pass Perks to receive rewards?\",\"id\":null},{\"children\":[{\"_key\":\"3133e4a06a43\",\"_type\":\"block\",\"children\":[{\"_key\":\"bc7c23bac6f6\",\"_type\":\"span\",\"marks\":[],\"text\":\"All Season Passholders and Memberships, excluding the Pre-K Pass, KidZPass, and the Knott's Scary Farm Pass.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"Who is eligible to earn Pass Perks?\",\"id\":null},{\"children\":[{\"_key\":\"e06310d5de5f\",\"_type\":\"block\",\"children\":[{\"_key\":\"5190838fcc8a\",\"_type\":\"span\",\"marks\":[],\"text\":\"Pass Perks are distributed to active Passholders and Members throughout the season. If a visit goal or other criteria is attached to a particular perk, that will be communicated ahead of time.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"How do I earn Pass Perks?\",\"id\":null},{\"children\":[{\"_key\":\"6994cc4d4756\",\"_type\":\"block\",\"children\":[{\"_key\":\"501ae9562b24\",\"_type\":\"span\",\"marks\":[],\"text\":\"Yes. This could include earning bonus Pass Perks based on an additional visit or acknowledging your visit milestone. Keep an eye on your inbox for potential surprises.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"Will Passholders be able to earn additional rewards throughout the season based on the number of visits?\",\"id\":null},{\"children\":[{\"_key\":\"219df60666ac\",\"_type\":\"block\",\"children\":[{\"_key\":\"a1a54ac9892e\",\"_type\":\"span\",\"marks\":[],\"text\":\"Pass Perks can be redeemed directly via QR code attached to each perk, or with a scan of your Season Pass.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"How do I redeem Pass Perks?\",\"id\":null},{\"children\":[{\"_key\":\"f111c60f24fa\",\"_type\":\"block\",\"children\":[{\"_key\":\"79d4cbc292e7\",\"_type\":\"span\",\"marks\":[],\"text\":\"Pass Perks can only be redeemed at your designated home park.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"I have the All-Park Passport. Does that change how I redeem Pass Perks?\",\"id\":null},{\"children\":[{\"_key\":\"7dac574ac982\",\"_type\":\"block\",\"children\":[{\"_key\":\"5092134f0d57\",\"_type\":\"span\",\"marks\":[],\"text\":\"No, this goes against the Terms and Conditions of the program. Pass Perks are subject to void if shared, sold, or gifted.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"Can I give my reward to another Passholder if unable to redeem during the validity period?\",\"id\":null},{\"children\":[{\"_key\":\"5289d1a21d33\",\"_type\":\"block\",\"children\":[{\"_key\":\"5388771b35d7\",\"_type\":\"span\",\"marks\":[],\"text\":\"Yes. Active reward campaigns have a loading cutoff date. For example, rewards that load on 12/15 would not be available to a new Passholder as of 12/16.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"Is there a qualifying cutoff to receive Pass Perks?\",\"id\":null},{\"children\":[{\"_key\":\"51ec7ac8bc42\",\"_type\":\"block\",\"children\":[{\"_key\":\"aa035cf5befb\",\"_type\":\"span\",\"marks\":[],\"text\":\"Look for Pass Perks in the Six Flags Mobile App. This section can be found by opening your Digital Wallet and selecting the Pass Perks tab at the top of your wallet.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"Where can I find my Pass Perks?\",\"id\":null},{\"children\":[{\"_key\":\"6189b09952e9\",\"_type\":\"block\",\"children\":[{\"_key\":\"f2e8ff906f3b\",\"_type\":\"span\",\"marks\":[],\"text\":\"Pass Perks has a dedicated corporate page that is updated regularly with new information. In addition, mobile app messages, text messages and, emails are sent on a regular basis to subscribed Passholders. We encourage Passholder to download the Six Flags Mobile App in order to view and stay up to date with their Pass Perks.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"I don't want to miss out on rewards, how can I stay up-to-date with Pass Perks?\",\"id\":null},{\"children\":[{\"_key\":\"5cbc6880c60e\",\"_type\":\"block\",\"children\":[{\"_key\":\"710bba8f90f0\",\"_type\":\"span\",\"marks\":[\"538d3aa4dae0\"],\"text\":\"New in 2026, there is one dedicated page.\"}],\"markDefs\":[{\"_key\":\"538d3aa4dae0\",\"_type\":\"link\",\"external\":\"https://www.sixflags.com/pass-perks\",\"externalIcon\":null,\"link\":\"https://www.sixflags.com/pass-perks\",\"linkType\":\"external\"}],\"style\":\"normal\"}],\"heading\":\"Where can I find the Pass Perks homepage for my park?\",\"id\":null},{\"children\":[{\"_key\":\"6549d2fc0b73\",\"_type\":\"block\",\"children\":[{\"_key\":\"9f1fd6a20828\",\"_type\":\"span\",\"marks\":[],\"text\":\"- Dedicated Emails to opted-in accounts\\n- Connections Newsletters\\n- Social Media\\n- Mobile App Messaging\\n- SMS Text\\n- In-park signage\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"What channels does Six Flags use to communicate with Passholders and Members?\",\"id\":null},{\"children\":[{\"_key\":\"c3e0be497114\",\"_type\":\"block\",\"children\":[{\"_key\":\"72f3aaff32af\",\"_type\":\"span\",\"marks\":[],\"text\":\"The majority of Pass Perks will not be tied to your visits. However, you can expect a few surprises throughout the season that will either require an additional visit or acknowledge the number of visits you had.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"Do my visits impact the rewards I receive?\",\"id\":null},{\"children\":[{\"_key\":\"8e327ebbfd03\",\"_type\":\"block\",\"children\":[{\"_key\":\"d3d509d6b5ed\",\"_type\":\"span\",\"marks\":[],\"text\":\"Additional benefits or entitlements will be listed in each Pass Perk reward description. It is important to thoroughly read each one prior to redemption.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"Do Bring-A-Friend Tickets acquired through Pass Perks come with additional benefits?\",\"id\":null},{\"children\":[{\"_key\":\"e16e6ae4862f\",\"_type\":\"block\",\"children\":[{\"_key\":\"4bbe1fc66b81\",\"_type\":\"span\",\"marks\":[],\"text\":\"Discounted Bring-A-Friend Tickets received through Pass Perks should be redeemed at a ticket window. FREE Bring-A-Friend Tickets can be redeemed directly at the turnstile at select parks. \"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"Where are Bring-A-Friend Tickets redeemed?\",\"id\":null},{\"children\":[{\"_key\":\"e70282f541e0\",\"_type\":\"block\",\"children\":[{\"_key\":\"1d6b84aa520f\",\"_type\":\"span\",\"marks\":[],\"text\":\"Yes, the Passholder or Member with the reward must be present at the time of entry in order to validate the Bring-A-Friend Reward. The Season Pass or Membership must be active and in good standing.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"Do Bring-A-Friend Tickets require the Passholder or Member to be present for entry?\",\"id\":null},{\"children\":[{\"_key\":\"dda844eccdd4\",\"_type\":\"block\",\"children\":[{\"_key\":\"a77fab870276\",\"_type\":\"span\",\"marks\":[],\"text\":\"At this time, Pass Perks are only redeemable at in-park locations.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"Can Pass Perks be used for online purchases?\",\"id\":null},{\"children\":[{\"_key\":\"762d0dcb7c60\",\"_type\":\"block\",\"children\":[{\"_key\":\"929b97fae907\",\"_type\":\"span\",\"marks\":[],\"text\":\"Validity varies by park and offer type. Be sure to check the expiration date in the mobile app.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"How long are Pass Perks valid for?\",\"id\":null},{\"children\":[{\"_key\":\"405aefaeba06\",\"_type\":\"block\",\"children\":[{\"_key\":\"c5dfbba9e51d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Pass Perks often become available within 1-2 days. In some cases, additional time may be necessary to fully complete the loading process.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"How long does it take for Pass Perks to load to my Season Pass/Membership?\",\"id\":null},{\"children\":[{\"_key\":\"733a12bdbee5\",\"_type\":\"block\",\"children\":[{\"_key\":\"0f7a5a9dcf86\",\"_type\":\"span\",\"marks\":[],\"text\":\"Reach out to VIPsupport@sixflags.com or visit Guest Relations during your next visit.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"heading\":\"Have questions or experiencing issues with Pass Perks?\",\"id\":null}],\"alignment\":\"center\",\"expandAllOnLoad\":false,\"externalTitle\":null,\"id\":\"perksfaq\"}]}\n"])</script>
</body></html>
