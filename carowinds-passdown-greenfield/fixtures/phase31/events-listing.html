 May 13th, 2027 | 9 AM - 5 PM\\n\\nEnjoy a thrilling day at the park exclusively for school groups! Carowinds will be closed to the public but OPEN for school groups for two fun-filled Thursdays this spring! Each ticket includes park admission, access to our Education Days activities, and an all-you-can-eat buffet.\\n\\nGather your students, pick a date, and help close the park down in a thrilling fashion!\\n\\n2027 Pricing:\\n\\n$60.67 (includes private event park admission and all-you-can-eat catered buffet)\\n\\nNOTE: Because this is a private day just for schools, season passes are not accepted. All attendees must have a valid School-Only Thursdays admission package for park entry.\",\"enableCardLink\":true,\"hideFromListing\":false,\"isGroupEvent\":true,\"link\":\"school-only-thursdays\",\"overrideText\":\"April 29th & May 13th, 2027 | 9 AM - 5 PM\",\"parkCode\":\"53\",\"parkSlug\":\"carowinds\",\"showTimesSchedule\":[{\"_key\":\"1ad9c90b7fb9\",\"_type\":\"showTimeSchedule\",\"endDate\":\"2027-05-13\",\"showTimes\":[{\"_key\":\"monday\",\"_type\":\"activitiesDay\",\"day\":\"Monday\"},{\"_key\":\"tuesday\",\"_type\":\"activitiesDay\",\"day\":\"Tuesday\"},{\"_key\":\"wednesday\",\"_type\":\"activitiesDay\",\"day\":\"Wednesday\"},{\"_key\":\"thursday\",\"_type\":\"activitiesDay\",\"availableTimes\":[],\"day\":\"Thursday\"},{\"_key\":\"friday\",\"_type\":\"activitiesDay\",\"day\":\"Friday\"},{\"_key\":\"saturday\",\"_type\":\"activitiesDay\",\"availableTimes\":[],\"day\":\"Saturday\"},{\"_key\":\"sunday\",\"_type\":\"activitiesDay\",\"availableTimes\":[],\"day\":\"Sunday\"}],\"startDate\":\"2027-04-29\"}],\"startDateTime\":\"2027-04-29\",\"title\":\"School-Only Thursdays\"},{\"_id\":\"5575dc95-41f4-404f-962f-7b04d212d9ba\",\"cardDescription\":null,\"description\":\"Celebrate your hardworking marching band, instrumental, chorus or dance group with a one-of-a-kind performance experience and a day filled with non-stop fun at Carowinds!\\n\\nOur Performance in the Park
